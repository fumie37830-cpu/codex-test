<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字くじ</title></head><body><main style="max-width:420px;margin:40px auto;text-align:center;font-family:sans-serif"><h1>数字くじ</h1><input id="max" type="number" min="1" value="10" style="font-size:24px;width:120px;text-align:center"><div id="result" style="font-size:96px;font-weight:bold;margin:30px">—</div><button id="draw" style="font-size:32px;padding:18px 50px">タップ</button></main><script>document.getElementById('draw').onclick=function(){var m=parseInt(document.getElementById('max').value,10);document.getElementById('result').textContent=m>0?Math.floor(Math.random()*m)+1:'?';};</script></body></html>
