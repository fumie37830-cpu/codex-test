<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>数字くじ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #222;
    }
    main {
      width: min(92vw, 420px);
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px 34px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 18px; font-size: 32px; }
    label { display: block; margin-bottom: 8px; font-size: 17px; }
    input {
      width: 140px;
      font-size: 28px;
      text-align: center;
      padding: 10px;
      border: 2px solid #bbb;
      border-radius: 12px;
    }
    #result {
      min-height: 128px;
      display: grid;
      place-items: center;
      margin: 24px 0;
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
    }
    button {
      width: 100%;
      min-height: 78px;
      border: 0;
      border-radius: 18px;
      background: #1f7a4d;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(.98); }
    p { margin: 14px 0 0; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>数字くじ</h1>
    <label for="max">何番まで？</label>
    <input id="max" type="number" min="1" step="1" value="10" inputmode="numeric">
    <div id="result" aria-live="polite">—</div>
    <button id="draw" type="button">タップ</button>
    <p>1から設定した数字までの中から、1つ表示します。</p>
  </main>

  <script>
    const maxInput = document.getElementById('max');
    const result = document.getElementById('result');
    const drawButton = document.getElementById('draw');

    function drawNumber() {
      const max = Number.parseInt(maxInput.value, 10);
      if (!Number.isInteger(max) || max < 1) {
        result.textContent = '?';
        maxInput.focus();
        return;
      }
      result.textContent = String(Math.floor(Math.random() * max) + 1);
    }

    drawButton.addEventListener('click', drawNumber);
    drawButton.addEventListener('touchend', (event) => {
      event.preventDefault();
      drawNumber();
    }, { passive: false });
  </script>
</body>
</html>
